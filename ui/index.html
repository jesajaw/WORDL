<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORDL Solver</title>
    <!-- PyScript Ressourcen -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
        input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; background: #2ea44f; color: white; border: none; border-radius: 4px; }
        #results { margin-top: 1.5rem; background: #f6f8fa; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>WORDL Solver</h1>

    <div class="input-group">
        <label for="green">Exakte Buchstaben (Grün) – z.B. A..E.:</label>
        <input type="text" id="green" placeholder="A..E.">
    </div>

    <div class="input-group">
        <label for="yellow">Enthaltene Buchstaben (Gelb):</label>
        <input type="text" id="yellow" placeholder="z.B. O, R">
    </div>

    <div class="input-group">
        <label for="gray">Auszuschließende Buchstaben (Grau):</label>
        <input type="text" id="gray" placeholder="z.B. X, Y, Z">
    </div>

    <button id="search-btn">Wörter suchen</button>

    <div id="results">Klicke auf "Wörter suchen", um Ergebnisse anzuzeigen.</div>

    <!-- PyScript Konfiguration und Logik -->
    <script type="py" config='{
        "files": {
            "./src/filter.py": "src/filter.py",
            "./src/wordlist.py": "src/wordlist.py",
            "./src/config.py": "src/config.py"
        }
    }'>
        from pyscript import document, when
        from src.wordlist import load_words
        from src.filter import WordFilter

        @when("click", "#search-btn")
        def run_filter(event):
            green_input = document.querySelector("#green").value
            yellow_input = document.querySelector("#yellow").value
            gray_input = document.querySelector("#gray").value
            
            # Hier greift die bestehende Python-Filterlogik
            # Die Aufrufe können je nach Ausgestaltung in src/filter.py angepasst werden
            words = load_words()
            wf = WordFilter(words)
            
            filtered = wf.filter(green=green_input, yellow=yellow_input, gray=gray_input)
            
            results_div = document.querySelector("#results")
            if filtered:
                results_div.innerText = f"Gefundene Wörter ({len(filtered)}):\n" + ", ".join(filtered)
            else:
                results_div.innerText = "Keine passenden Wörter gefunden."
    </script>

</body>
</html>
