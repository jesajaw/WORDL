<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>WORDL Filter</title>
<style>
  :root {
    --bg: #1e1e24; --bg-light: #2a2a33; --fg: #e0dff0;
    --accent: #9b59d9; --accent-dark: #6c3fa0; --status: #c9a6f5;
    --tile-absent: #3a3a3c; --tile-present: #b59f3b; --tile-correct: #538d4e; --tile-border: #565758;
    --font-ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: Consolas, "SFMono-Regular", Menlo, "Liberation Mono", monospace;
    --tile: min(56px, 15vw);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-ui); }
  body { padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
  main { max-width: 460px; margin: 0 auto; }
  h1 { margin: 6px 0 2px; font-size: 20px; color: var(--accent); }
  .status { font-family: var(--font-mono); font-size: 12px; color: var(--status); }
  .intro { margin: 0 0 10px; }

  /* board */
  .board { display: grid; grid-template-columns: repeat(5, var(--tile)); gap: 6px; justify-content: center; margin: 10px 0; user-select: none; }
  .tile {
    width: var(--tile); height: var(--tile); display: grid; place-items: center;
    font-size: calc(var(--tile) * .42); font-weight: 700; color: #fff; cursor: pointer;
    background: var(--bg); border: 2px solid var(--tile-border);
  }
  .tile.absent { background: var(--tile-absent); }
  .tile.present { background: var(--tile-present); }
  .tile.correct { background: var(--tile-correct); }
  .tile.focus { border-color: var(--accent); }

  /* cells (same look as mtools) */
  .row { display: flex; gap: 8px; margin: 0 0 8px; }
  .cell {
    flex: 1; min-width: 0; padding: 8px; text-align: left; font: inherit; color: var(--fg);
    background: var(--bg-light); border: 2px groove var(--accent-dark); border-radius: 2px;
  }
  button.cell { cursor: pointer; }
  button.cell:hover, button.cell:active { background: var(--accent-dark); border-color: var(--accent); }
  .cell .title { font-weight: 700; }
  .cell .status { margin-top: 4px; min-height: 1.4em; overflow-wrap: anywhere; }
  .row.buttons .cell { text-align: center; padding: 10px 8px; font-weight: 700; }

  /* remaining words */
  fieldset { margin: 0 0 10px; padding: 6px 8px 8px; border: 1px solid var(--accent-dark); border-radius: 2px; min-width: 0; }
  legend { padding: 0 6px; color: var(--accent); }
  .words {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(4.4em, 1fr)); gap: 2px 4px;
    max-height: 250px; overflow-y: auto; padding: 6px; background: var(--bg-light);
    font-family: var(--font-mono); font-size: 15px; scrollbar-color: var(--accent-dark) var(--bg);
  }
  .words button { all: unset; cursor: pointer; padding: 1px 3px; color: var(--status); border-radius: 2px; }
  .words button:hover { background: var(--accent-dark); color: var(--fg); }
  .words .hint { grid-column: 1 / -1; color: var(--fg); }

  /* on-screen keyboard (phones / tablets have no physical keyboard) */
  .kb { display: grid; gap: 6px; margin-bottom: 10px; user-select: none; }
  .kb .krow { display: flex; gap: 4px; justify-content: center; }
  .kb button { flex: 1; max-width: 42px; padding: 11px 0; text-align: center; font-weight: 700; }
  .kb button.wide { max-width: 64px; }
  footer { margin-top: 6px; text-align: center; font-size: 12px; opacity: .8; }
  footer a { color: var(--status); }
</style>
</head>
<body>
<main>
  <h1>WORDL Filter</h1>

  <div class="board" id="board" role="grid" aria-label="Guess board"></div>

  <div class="row buttons">
    <button class="cell" id="clear" type="button">Clear</button>
    <button class="cell" id="undo" type="button">Undo</button>
  </div>

  <div class="row">
    <div class="cell"><div class="title">Possible words</div><div class="status" id="count"></div></div>
  </div>

  <fieldset>
    <legend>Remaining words</legend>
    <div class="words" id="words"></div>
  </fieldset>

  <div class="kb" id="kb" aria-label="On-screen keyboard"></div>

  <footer>Open source &middot; <a href="https://github.com/jesajaw/WORDL">github.com/jesajaw/WORDL</a></footer>
</main>

// LOGIC_START -- pure logic (no DOM); mirrors src/filter.py
const WORD_LENGTH = 5, MAX_GUESSES = 6;
const CYCLE = ["absent", "present", "correct"];

// Colors Wordle would show for `guess` if `answer` were the solution, as a string like "apacc"
function feedback(guess, answer) {
  const result = Array(guess.length).fill("a");
  const unmatched = {};
  for (let i = 0; i < guess.length; i++) {
    if (guess[i] !== answer[i]) unmatched[answer[i]] = (unmatched[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < guess.length; i++) if (guess[i] === answer[i]) result[i] = "c";
  for (let i = 0; i < guess.length; i++) {
    if (result[i] !== "c" && unmatched[guess[i]] > 0) { result[i] = "p"; unmatched[guess[i]]--; }
  }
  return result.join("");
}

// rows: [{guess: "crane", pattern: "apacc"}] -- a word stays possible iff replaying every guess gives the same colors
function filterWords(words, rows) {
  return words.filter(w => rows.every(r => feedback(r.guess, w) === r.pattern));
}

function entropy(guess, candidates) {
  const buckets = new Map();
  for (const c of candidates) { const k = feedback(guess, c); buckets.set(k, (buckets.get(k) || 0) + 1); }
  let h = 0;
  for (const n of buckets.values()) { const p = n / candidates.length; h -= p * Math.log2(p); }
  return h;
}

function frequencyScores(candidates) {
  const perPosition = Array.from({ length: WORD_LENGTH }, () => ({}));
  const overall = {};
  for (const w of candidates) {
    for (let i = 0; i < WORD_LENGTH; i++) perPosition[i][w[i]] = (perPosition[i][w[i]] || 0) + 1;
    for (const ch of new Set(w)) overall[ch] = (overall[ch] || 0) + 1;
  }
  return candidates.map(w => {
    let s = 0;
    for (let i = 0; i < WORD_LENGTH; i++) s += perPosition[i][w[i]];
    for (const ch of new Set(w)) s += overall[ch];
    return [w, s / candidates.length];
  });
}

// Best next guesses among the remaining words as [word, score] -- higher is better
function suggest(candidates, limit = SUGGESTION_COUNT) {
  if (!candidates.length) return [];
  if (candidates.length <= 2) return candidates.map(w => [w, 1]);
  const scored = candidates.length <= ENTROPY_LIMIT
    ? candidates.map(w => [w, entropy(w, candidates)])
    : frequencyScores(candidates);
  const r9 = x => Math.round(x * 1e9);        // equal scores tie-break alphabetically, not by float noise
  scored.sort((a, b) => (r9(b[1]) - r9(a[1])) || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  return scored.slice(0, limit);
}
// LOGIC_END

// ---------------------------------------------------------------- board model + UI
const letters = Array.from({ length: MAX_GUESSES }, () => Array(WORD_LENGTH).fill(""));
const states = Array.from({ length: MAX_GUESSES }, () => Array(WORD_LENGTH).fill("empty"));
let focus = { r: 0, c: 0 };
let lastKey = null;

const $ = id => document.getElementById(id);
const boardEl = $("board"), wordsEl = $("words");
const tileEls = [];

for (let r = 0; r < MAX_GUESSES; r++) {
  tileEls.push([]);
  for (let c = 0; c < WORD_LENGTH; c++) {
    const el = document.createElement("div");
    el.className = "tile";
    el.setAttribute("role", "gridcell");
    el.addEventListener("click", () => { setFocus(r, c); cycle(r, c); });
    boardEl.appendChild(el);
    tileEls[r].push(el);
  }
}

function renderTile(r, c) {
  const el = tileEls[r][c], state = states[r][c];
  el.textContent = letters[r][c];
  el.className = "tile" + (state !== "empty" ? " " + state : "") + (focus.r === r && focus.c === c ? " focus" : "");
  el.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}: ${letters[r][c] || "empty"}${state !== "empty" ? ", " + state : ""}`);
}
function renderAll() { for (let r = 0; r < MAX_GUESSES; r++) for (let c = 0; c < WORD_LENGTH; c++) renderTile(r, c); }

function setFocus(r, c) {
  const old = focus;
  focus = { r, c };
  renderTile(old.r, old.c);
  renderTile(r, c);
}

function cycle(r = focus.r, c = focus.c) {
  if (!letters[r][c]) return;
  states[r][c] = CYCLE[(CYCLE.indexOf(states[r][c]) + 1) % CYCLE.length];
  renderTile(r, c);
  update();
}

function putLetter(ch) {
  const { r, c } = focus;
  letters[r][c] = ch.toUpperCase();
  if (states[r][c] === "empty") states[r][c] = "absent";
  if (c + 1 < WORD_LENGTH) setFocus(r, c + 1);
  else if (r + 1 < MAX_GUESSES) setFocus(r + 1, 0);
  renderTile(r, c);
  update();
}

function clearTile(r, c) { letters[r][c] = ""; states[r][c] = "empty"; renderTile(r, c); }

function backspace() {
  let { r, c } = focus;
  if (!letters[r][c]) {                       // nothing here: step back and delete that one instead
    if (c > 0) c--; else if (r > 0) { r--; c = WORD_LENGTH - 1; }
    setFocus(r, c);
  }
  clearTile(r, c);
  update();
}

function move(step) {
  const index = Math.min(Math.max(focus.r * WORD_LENGTH + focus.c + step, 0), MAX_GUESSES * WORD_LENGTH - 1);
  setFocus(Math.floor(index / WORD_LENGTH), index % WORD_LENGTH);
}

const isComplete = r => letters[r].every(Boolean);

function clearBoard() {
  for (let r = 0; r < MAX_GUESSES; r++) for (let c = 0; c < WORD_LENGTH; c++) clearTile(r, c);
  setFocus(0, 0);
  update();
}

function removeLastRow() {
  for (let r = MAX_GUESSES - 1; r >= 0; r--) {
    if (letters[r].some(Boolean)) {
      for (let c = 0; c < WORD_LENGTH; c++) clearTile(r, c);
      setFocus(r, 0);
      update();
      return;
    }
  }
}

function fillNextRow(word) {                  // first row that isn't a complete guess yet, all grey by default
  for (let r = 0; r < MAX_GUESSES; r++) {
    if (!isComplete(r)) {
      [...word.toUpperCase()].forEach((ch, c) => { letters[r][c] = ch; states[r][c] = "absent"; renderTile(r, c); });
      setFocus(Math.min(r + 1, MAX_GUESSES - 1), 0);
      update();
      return;
    }
  }
}

function completeRows() {                     // fully typed rows only; unfinished rows are ignored
  const rows = [];
  for (let r = 0; r < MAX_GUESSES; r++) {
    if (isComplete(r)) rows.push({ guess: letters[r].join("").toLowerCase(), pattern: states[r].map(s => s[0]).join("") });
  }
  return rows;
}

// ---------------------------------------------------------------- results
function update() {
  const rows = completeRows();
  const key = JSON.stringify(rows);
  if (key === lastKey) return;                // e.g. typing into an unfinished row: nothing to recompute
  lastKey = key;

  const words = filterWords(WORDS, rows);
  $("count").textContent = `${words.length} of ${WORDS.length}`;
  $("suggest").textContent = suggest(words).map(([w]) => w.toUpperCase()).join("  ") || "-";

  wordsEl.textContent = "";
  if (!words.length) {
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "No matches -- check the tile colors (new rows start all grey).";
    wordsEl.appendChild(hint);
    return;
  }
  const frag = document.createDocumentFragment();
  for (const w of words) {
    const b = document.createElement("button");
    b.type = "button";
    b.tabIndex = -1;
    b.textContent = w.toUpperCase();
    frag.appendChild(b);
  }
  wordsEl.appendChild(frag);
  wordsEl.scrollTop = 0;
}

// ---------------------------------------------------------------- input
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  let handled = true;
  if (e.key === "Backspace" || e.key === "Delete") backspace();
  else if (e.key === " ") cycle();
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowUp") move(-WORD_LENGTH);
  else if (e.key === "ArrowDown") move(WORD_LENGTH);
  else if (/^[a-zA-Z]$/.test(e.key)) putLetter(e.key);
  else handled = false;
  if (handled) e.preventDefault();
});

// keep buttons from stealing keyboard focus, otherwise Space would "click" the last pressed button
document.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });

wordsEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) fillNextRow(b.textContent); });
$("clear").addEventListener("click", clearBoard);
$("undo").addEventListener("click", removeLastRow);

const kb = $("kb");
for (const line of ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"]) {
  const row = document.createElement("div");
  row.className = "krow";
  if (line.startsWith("Z")) row.appendChild(keyButton("Space", "space", cycle, "wide"));
  for (const ch of line) row.appendChild(keyButton(ch, ch, () => putLetter(ch)));
  if (line.startsWith("Z")) row.appendChild(keyButton("\u232B", "backspace", backspace, "wide"));
  kb.appendChild(row);
}
function keyButton(label, name, fn, extra = "") {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "cell " + extra;
  b.tabIndex = -1;
  b.textContent = label;
  b.setAttribute("aria-label", name);
  b.addEventListener("click", () => fn());
  return b;
}

renderAll();
update();
</script>
</body>
</html>
